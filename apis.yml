aid: splice
name: Splice
description: >-
  Splice is a New York City-based music creation platform founded in 2013 by
  Steve Martocci and Matt Aimonetti that operates a royalty-free sample
  marketplace, a rent-to-own plugin store, and a growing suite of in-house
  instruments, AI tools, and DAW integrations for producers and beatmakers.
  Splice Sounds offers a credit-based subscription giving access to millions
  of cleared samples, loops, presets, and MIDI; Splice INSTRUMENT is the
  company's virtual instrument with free monthly preset drops; Astra is a
  Splice-built hybrid synthesizer covering virtual analog, wavetable,
  sampling, granular, and FM synthesis; Beatmaker is its drum-machine
  instrument; and Bridge is a free plugin that surfaces the Splice Sounds
  catalog directly inside Ableton Live, Studio One, Pro Tools, and Studio
  Pro with automatic key and tempo matching. Splice has also rolled out
  generative AI features including Create Mode (build "Stacks" from any
  loop), Variations (regenerate any Splice sample with creator
  compensation), Craft (turn catalog sounds into playable instruments inside
  INSTRUMENT), and an upcoming Magic Fit (harmonic/rhythmic auto-matching
  to a session), with an announced ElevenLabs partnership for next-gen AI
  music tools. The company acquired Superpowered and Audiaire in 2020 and
  Spitfire Audio in 2025, and operates a rent-to-own marketplace of 130+
  third-party plugins (Serum 2, V Collection, Abbey Road, etc.). Splice
  does not publish a public developer API, SDK, or webhook surface; the
  business is a consumer/prosumer SaaS for music creators, distributed via
  desktop app, mobile app, and DAW plugin integrations rather than a
  programmable platform.
